<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 100 100">
  <title>Future Shock Media</title>
  <rect width="100" height="100" fill="#952d90"/>
  <!-- antenna -->
  <rect x="47" y="8" width="6" height="17" rx="2.5" fill="#f5f0ef"/>
  <!-- outer left arc: semicircle pointing left, r≈29, from (33,21) to (33,79) -->
  <path d="M33 21 a29 29 0 0 0 0 58" fill="none" stroke="#f5f0ef" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- outer right arc: semicircle pointing right, r≈29, from (67,21) to (67,79) -->
  <path d="M67 21 a29 29 0 0 1 0 58" fill="none" stroke="#f5f0ef" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- inner left arc: smaller semicircle pointing left, r≈17, from (21,33) to (21,67) -->
  <path d="M21 33 a17 17 0 0 0 0 34" fill="none" stroke="#f5f0ef" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- inner right arc: smaller semicircle pointing right, r≈17, from (79,33) to (79,67) -->
  <path d="M79 33 a17 17 0 0 1 0 34" fill="none" stroke="#f5f0ef" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- center dot -->
  <circle cx="50" cy="50" r="8" fill="#f5f0ef"/>
</svg>
